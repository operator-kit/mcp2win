version: 2

project_name: mcp2win

builds:
  - main: ./cmd/mcp2win
    binary: mcp2win
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  draft: true

# Scoop bucket — uncomment when operator-kit/scoop-bucket repo exists
# and SCOOP_BUCKET_TOKEN secret is configured in release.yml
#
# scoops:
#   - repository:
#       owner: operator-kit
#       name: scoop-bucket
#       token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
#     homepage: "https://github.com/operator-kit/mcp2win"
#     description: "Convert MCP server configs to Windows-compatible format"
#     license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
